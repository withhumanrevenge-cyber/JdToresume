# Alembic (database migrations). Run from the repo root, e.g.:
#   .venv/Scripts/python.exe -m alembic upgrade head
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "add jobs table"
# The database URL is NOT set here: env.py reads DATABASE_URL from the app settings.

[alembic]
script_location = server/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
