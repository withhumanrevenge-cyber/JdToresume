# CD: every merge to main (and every v* tag) publishes the API image to GitHub Container Registry, tagged with
# the commit SHA (and "latest" on main, the version on tags). Main only receives pull requests that passed CI.
#
# Not here yet, on purpose: deploying to AWS. It needs the Terraform in infra/terraform and an AWS role this
# workflow assumes through GitHub OIDC (no long-lived keys). See docs/engineering/WORK_LEFT.md, "Deploy".
# The web app deploys through Vercel's Git integration once the project is connected there.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish halfway

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's own token

jobs:
  api-image:
    name: publish api image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/jdtoresume-api
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
