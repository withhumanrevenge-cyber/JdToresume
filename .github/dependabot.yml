# Weekly dependency update PRs. They go through the same CI and review as any other change to main.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml at the root)
    directory: /
    schedule: { interval: weekly }
    groups:
      js-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /server
    schedule: { interval: weekly }
